[project]
name = "bvivhedge"
version = "1.0.0"
description = "BTC volatility forecasting and BVIV-perpetual hedging with a 15-minute VWAP ratchet"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.12", "matplotlib>=3.8", "arch>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
